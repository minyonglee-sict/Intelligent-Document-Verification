# 컨테이너에서만 쓰는 값들. docker-compose.yml 이 SPRING_PROFILES_ACTIVE=docker 로
# 이 파일을 얹는다 -- application.properties(로컬 실행용 localhost 주소)는 그대로 두고
# 여기 있는 값만 덮어쓴다.

# engine 은 docker-compose.yml 의 서비스 이름 -- 같은 네트워크 안에서는 호스트 이름으로 붙는다.
idv.engine.base-url=http://engine:8000

# 컨테이너 안에서는 5173 개발 서버가 없다. 프론트는 nginx(frontend 컨테이너)가 서빙하고
# /api 는 nginx가 이 백엔드로 프록시하므로 대부분은 브라우저 입장에서 교차 출처 자체가
# 안 생긴다 -- 그래도 브라우저는 POST 요청에 Origin 헤더를 여전히 보내고, Spring의 CORS
# 필터는 그 값을 허용 목록과 비교하므로(같은 출처든 아니든) 목록에 없으면 막힌다.
# 그래도 컨테이너 밖에서 8080을 직접 두드리는 개발/디버깅 편의를 위해 localhost도 열어 둔다.
#
# idv-check.shop -- 가비아에서 산 고정 도메인. Named Tunnel(cloudflared config.yml)로
# 재시작해도 안 바뀌게 연결해 뒀다. *.trycloudflare.com은 Quick Tunnel(임시 데모, 재시작마다
# 주소가 바뀜)용으로 당분간 같이 남겨 둔다 -- 완전히 옮기면 지워도 된다.
idv.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,https://idv-check.shop,https://*.trycloudflare.com
