spring.application.name=idv-backend
server.port=8080

# Python 검증 엔진(api.py). 이 백엔드는 업무 규칙을 갖지 않고 여기로 넘긴다.
# 개발용 DB로 격리해 띄운 것을 가리킨다:
#   MSSQL_DATABASE=DocumentVerification_Dev uvicorn api:app --port 8000
idv.engine.base-url=http://127.0.0.1:8000

# 문서 처리는 접수만 하고 끝나지만(202), 업로드 자체는 파일 크기만큼 걸린다.
idv.engine.timeout-seconds=120

# React 개발 서버(Vite 기본 포트)에서 부를 수 있게 열어 둔다.
idv.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# PDF 는 수십 MB가 되기도 한다. 기본값(1MB)이면 업로드가 막힌다.
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
