# frontend/src/api.ts 는 '/api' 상대경로만 부른다(주소가 코드에 안 박혀 있음) --
# 그래서 로컬 개발 때 vite.config.ts 가 하던 프록시 역할을, 컨테이너에서는 nginx가
# 그대로 이어받는다. 화면 코드는 로컬이든 컨테이너든 손댈 필요가 없다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        # 문서 업로드가 커서 넉넉히 잡는다 (application.properties 의 64MB와 맞춘다)
        client_max_body_size 64M;
    }

    location / {
        try_files $uri /index.html;
    }
}
